# CI for the WorkHorse plugin. No secrets anywhere: nothing here talks to a database or an API.
# The job asserts how many tests ran, so a suite that skipped its way to green fails instead.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - name: Plugin tests (hooks, wh CLI, agent and template structure)
        run: |
          npm test 2>&1 | tee plugin-tests.log
          # The runner prints "N passed, M failed" and exits non-zero on any failure; also refuse a
          # run that somehow executed nothing.
          passed=$(grep -oP '^\K[0-9]+(?= passed)' plugin-tests.log | tail -1)
          echo "passed: $passed"
          test "${passed:-0}" -ge 140
